[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-to-pdf"
version = "0.1.0"
description = "Convert .ppt and .pptx files in a folder to PDFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ppt-to-pdf = "ppt_to_pdf.cli:main"

[tool.setuptools.packages.find]
include = ["ppt_to_pdf*"]
